<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #0e0f11;
            --surface:  #16181c;
            --border:   rgba(255,255,255,0.07);
            --sage:     #8aab96;
            --sage-dim: rgba(138,171,150,0.15);
            --text:     #dcd9d0;
            --muted:    rgba(220,217,208,0.38);
            --user-bg:  rgba(138,171,150,0.13);
            --radius:   18px;
        }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ambient glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 45% at 20% 10%, rgba(138,171,150,0.07) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 85% 85%, rgba(100,130,170,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        header {
            width: 100%;
            max-width: 720px;
            padding: 28px 32px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .wordmark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.65rem;
            font-weight: 300;
            letter-spacing: 0.18em;
            color: var(--text);
            text-transform: lowercase;
        }

        .wordmark span {
            color: var(--sage);
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--sage);
            box-shadow: 0 0 8px var(--sage);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.85); }
        }

        /* ── Chat window ── */
        #chat-window {
            flex: 1;
            width: 100%;
            max-width: 720px;
            overflow-y: auto;
            padding: 28px 32px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        /* welcome state */
        .empty-state {
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: fadeUp 0.8s ease both;
        }

        .empty-state .big-word {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.4rem, 6vw, 3.8rem);
            font-weight: 300;
            font-style: italic;
            color: var(--text);
            line-height: 1;
        }

        .empty-state p {
            font-size: 0.85rem;
            color: var(--muted);
            max-width: 300px;
            line-height: 1.7;
        }

        /* message bubbles */
        .message {
            max-width: 78%;
            line-height: 1.65;
            font-size: 0.92rem;
            animation: fadeUp 0.35s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
            border: 1px solid rgba(138,171,150,0.18);
            border-radius: var(--radius) var(--radius) 4px var(--radius);
            padding: 11px 16px;
            color: var(--text);
        }

        .message.bot {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) var(--radius) 4px;
            padding: 11px 16px;
            color: var(--text);
        }

        /* typing indicator */
        .typing {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) var(--radius) 4px;
            animation: fadeUp 0.3s ease both;
        }

        .typing span {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s ease-in-out infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0);   opacity: 0.4; }
            50%       { transform: translateY(-4px); opacity: 1;   }
        }

        /* ── Input bar ── */
        .input-area {
            width: 100%;
            max-width: 720px;
            padding: 16px 32px 28px;
            position: relative;
            z-index: 1;
        }

        .input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 8px 8px 22px;
            transition: border-color 0.25s;
        }

        .input-bar:focus-within {
            border-color: rgba(138,171,150,0.4);
            box-shadow: 0 0 0 3px rgba(138,171,150,0.06);
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #message-input::placeholder { color: var(--muted); }

        #send-button {
            flex-shrink: 0;
            width: 38px; height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--sage);
            color: #0e0f11;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
        }

        #send-button:hover  { background: #9dbfa8; }
        #send-button:active { transform: scale(0.92); }

        #send-button svg { width: 16px; height: 16px; }

        .hint {
            text-align: center;
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 10px;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>

<header>
    <div class="wordmark">res<span>o</span>nare</div>
    <div class="status-dot"></div>
</header>

<div id="chat-window">
    <div class="empty-state" id="empty-state">
        <div class="big-word">how are you<br>feeling?</div>
        <p>A quiet space to talk. No judgment, just presence.</p>
    </div>
</div>

<div class="input-area">
    <div class="input-bar">
        <input type="text" id="message-input" placeholder="Share what's on your mind…" autocomplete="off">
        <button id="send-button" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
    <p class="hint">Press Enter to send</p>
</div>

<script src="script.js"></script>
<script>
    const chatWindow   = document.getElementById('chat-window');
    const input        = document.getElementById('message-input');
    const sendBtn      = document.getElementById('send-button');
    const emptyState   = document.getElementById('empty-state');

    function removeEmpty() {
        if (emptyState) emptyState.remove();
    }

    function appendMessage(text, sender) {
        removeEmpty();
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return div;
    }

    function showTyping() {
        removeEmpty();
        const t = document.createElement('div');
        t.className = 'typing';
        t.id = 'typing-indicator';
        t.innerHTML = '<span></span><span></span><span></span>';
        chatWindow.appendChild(t);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeTyping() {
        const t = document.getElementById('typing-indicator');
        if (t) t.remove();
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        appendMessage(text, 'user');
        showTyping();

        try {
            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            removeTyping();
            appendMessage(data.message, 'bot');
        } catch (err) {
            removeTyping();
            appendMessage("I'm here — something went wrong on my end. Try again?", 'bot');
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
